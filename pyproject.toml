[project]
name = "proteus"
version = "0.0.1"
description = "Certified-by-construction detection over conserved evidence for ML-based network intrusion detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numba",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
attacks = [
    "adversarial-robustness-toolbox",
    "torch",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proteus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
